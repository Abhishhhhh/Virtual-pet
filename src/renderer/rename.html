<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    box-sizing: border-box;
    padding: 16px;
  }
  p { margin: 0 0 10px; font-size: 13px; color: #333; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .row { display: flex; gap: 8px; width: 100%; }
  button {
    flex: 1;
    padding: 8px 0;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #save { background: #4a7dff; color: white; }
  #cancel { background: #e5e5e5; color: #333; }
</style>
</head>
<body>
  <p>What should we call your pet?</p>
  <input id="name" maxlength="24" autofocus />
  <div class="row">
    <button id="cancel">Cancel</button>
    <button id="save">Save</button>
  </div>
  <script>
    const input = document.getElementById('name');
    document.getElementById('save').onclick = () => window.renameAPI.submit(input.value);
    document.getElementById('cancel').onclick = () => window.renameAPI.cancel();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.renameAPI.submit(input.value);
      if (e.key === 'Escape') window.renameAPI.cancel();
    });
  </script>
</body>
</html>
